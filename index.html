<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>
        
        <header class="header container">
            <a href="/" class="logo">
                <span class="logo-text">Aveline</span>
                <i class="fa-solid fa-utensils"></i>
            </a>

            <nav class="navbar">
                <ul class="nav-list" id="navMenu">
                    <li class="list-item"><a href="#" class="link">Home</a></li>
                    <li class="list-item"><a href="#" class="link">About Us</a></li>
                    <li class="list-item"><a href="#" class="link">Our Menu</a></li>
                    <li class="list-item"><a href="#" class="link">Gallery</a></li>
                    <li class="list-item"><a href="#" class="link">Contact</a></li>

                    <li class="list-item mobile-btn">
                        <button class="nav-btn">Book a Table</button>
                    </li>
                </ul>
                <button class="nav-btn desktop-btn">Book a Table</button>
                <button class="hamburger-btn" id="hamburgerMenu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </nav>
        </header>

        <main class="hero container">
            <section class="hero-section">
                <h1 class="title">Indulge in Timeless Elegance & Exquisite Cuisine</h1>
                <p class="desc">Experience the Art of Fine Dining at Aveline</p>
                <div class="hero-btns">
                    <button class="view-btn">View Our Menu</button>
                    <button class="reservation-btn">Make a Reservation</button>
                </div>
            </section>

            <section class="img-wrapper">
                <img src="assets/food.jpg" alt="fine-dining food" class="hero-img">
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
